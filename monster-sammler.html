<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dosen-Dex: Monster-Sammlung</title>
<style>
:root{--bg:#f2f4ee;--sf:#fff;--tx:#161a14;--mu:#667060;--ac:#4a9a00;--acx:#fff;--ln:#d9ded2;--st:#e0a800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12150f;--sf:#1c211a;--tx:#eef2e8;--mu:#97a38f;--ac:#8dff1f;--acx:#10200a;--ln:#2e362a;--st:#ffc933}}
:root[data-theme="dark"]{--bg:#12150f;--sf:#1c211a;--tx:#eef2e8;--mu:#97a38f;--ac:#8dff1f;--acx:#10200a;--ln:#2e362a;--st:#ffc933}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;max-width:560px;margin:0 auto;padding:0 14px 96px}
h1{font:800 26px/1 "Arial Black",Impact,sans-serif;margin:18px 0 4px;letter-spacing:-.5px}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}
.bar{height:12px;background:var(--ln);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .4s}
.tabs,.chips{display:flex;gap:8px;margin:14px 0 10px;overflow-x:auto}
button{font:inherit;color:inherit;cursor:pointer}
.tab,.chip{border:1px solid var(--ln);background:var(--sf);padding:8px 14px;border-radius:20px;white-space:nowrap}
.tab.on,.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
input[type=search],input[type=text],select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px;margin:8px 0;width:100%;text-align:left}
.th{width:48px;height:48px;border-radius:8px;background:var(--ln);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--mu);font-weight:700}
.row.miss .th{opacity:.6}
.row .n{flex:1;min-width:0}
.row .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{color:var(--mu)}
.stars{color:var(--st);letter-spacing:1px;white-space:nowrap}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--acx);border:0;border-radius:30px;padding:15px 28px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:5}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.card{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.card h2{margin:0 0 10px;font-size:20px}
.pic{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--ln);display:grid;place-items:center;color:var(--mu);margin-bottom:10px}
.btn{border:1px solid var(--ln);background:var(--sf);padding:11px 14px;border-radius:10px;margin:4px 4px 4px 0}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.rate{font-size:34px;color:var(--st);margin:6px 0;display:flex;gap:2px}
.rate button{background:none;border:0;font-size:34px;line-height:1;padding:2px;color:inherit}
video{width:100%;border-radius:12px;background:#000;max-height:50vh}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center}
.badge.off{opacity:.45}
.badge b{display:block;font-size:26px}
.hint{color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.g button{aspect-ratio:1;padding:0;border:1px solid var(--ln);background:var(--sf);border-radius:4px;font-size:11px;color:var(--mu);overflow:hidden}
.g button.got{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.g button.fr{opacity:.45;border-style:dashed}
.g img{width:100%;height:100%;object-fit:cover;display:block}
:root:not([data-theme="none"]){color-scheme:dark;--bg:#0a0c08;--sf:#161a12;--tx:#f2f7ea;--mu:#9aa590;--ac:#8dff1f;--acx:#0a1204;--ln:#2a3324;--st:#ffd23d}
body{background:radial-gradient(ellipse at 50% 0,var(--bg1) 0,#0a0c08 60%) fixed no-repeat,#0a0c08}
h1{display:flex;align-items:center;gap:10px;font:italic 900 36px/1 Impact,"Arial Black",sans-serif;color:var(--ac);text-shadow:0 0 14px rgba(var(--acr),.55);margin:16px 0 6px}
h1 svg{width:26px;height:36px;fill:var(--ac);filter:drop-shadow(0 0 6px var(--ac))}
.bar{height:14px;border-radius:3px;transform:skewX(-20deg);background:#1b2316}
.bar i{background:repeating-linear-gradient(115deg,var(--ac) 0 10px,var(--ac3) 10px 20px);box-shadow:0 0 12px var(--ac)}
.tab,.chip{border-radius:4px;transform:skewX(-10deg);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.tab.on,.chip.on{box-shadow:0 0 10px var(--ac)}
.fab{border-radius:4px;transform:translateX(-50%) skewX(-10deg);box-shadow:0 0 20px var(--ac);text-transform:uppercase;letter-spacing:.6px;font-size:17px}
.row{border-left-width:6px}
.gw{overflow-x:auto;padding-bottom:10px}
.g{grid-template-columns:repeat(10,74px);gap:5px;width:max-content}
.g.sm{grid-template-columns:repeat(10,1fr);gap:3px;width:auto}
.g .cl{position:relative;width:100%;height:74px;aspect-ratio:auto;padding:4px;border:2px solid var(--c);border-radius:8px;background:linear-gradient(170deg,var(--c) 0,var(--c) 30%,#0d110a 100%);color:#fff;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;filter:saturate(.55) brightness(.8)}
.g .cl.g1{filter:none;box-shadow:0 0 10px var(--c)}
.g .cl.fe{background:transparent;border:1px dashed var(--ln);filter:none;opacity:.5;color:var(--mu)}
.g .cl i{font-style:normal;font-size:12px;font-weight:900;position:relative;text-shadow:0 1px 2px #000}
.g .cl b{position:relative;font:800 10px/1.1 "Trebuchet MS",sans-serif;margin:0 -4px -4px;padding:3px 4px;background:rgba(0,0,0,.62);text-shadow:0 1px 2px #000;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.g .cl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g.sm .cl{height:auto;aspect-ratio:1;padding:0;justify-content:center;align-items:center;border-width:1px}
.g.sm .cl b{display:none}
.pr{border:1px solid var(--ln);border-left:5px solid var(--ac);background:var(--sf);border-radius:8px;padding:10px 12px;margin:14px 0 0}
.pr p{margin:4px 0;font-size:14px}
.pr a{text-decoration:none;display:inline-block;color:var(--tx)}
.pr .btn.pri{color:var(--acx)}
.of{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.of:last-of-type{border-bottom:0}
.op{text-align:right;flex:none}
.op b{display:block;font-size:20px;color:var(--ac)}
.op .btn{display:inline-block;margin:6px 0 0;padding:6px 10px;font-size:13px}
.pr textarea{margin:8px 0}
#pt{cursor:pointer;position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:10px;z-index:30;margin:0;padding:3px 9px;border-radius:999px;background:rgba(20,22,18,.88);border:1px solid #2f3a22;font-size:14px;line-height:1.2;width:auto}
#pt .fl{margin:0}
.pgt{display:flex;gap:8px;margin:12px 0 0}
.pgt button{flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf);padding:9px 2px;border-radius:4px;font-weight:800;font-size:11px;text-transform:uppercase;transform:skewX(-10deg)}
.pgt button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);box-shadow:0 0 10px var(--ac)}
.pg{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.pp{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 14px}
.pp h3{margin:18px 0 6px;font-size:16px}
.pc{text-align:center;background:linear-gradient(160deg,var(--bg1),#0d160a);border:1px solid var(--ac);border-radius:14px;padding:20px 14px;margin:14px 0;box-shadow:0 0 22px rgba(var(--acr),.25)}
.ring{width:100%;margin:0 auto 8px}
.ring svg{display:block;width:110px;height:154px;margin:0 auto 6px;filter:drop-shadow(0 0 8px rgba(255,255,255,.45))}
.rn{display:flex;flex-direction:column;align-items:center}
.rn b{font:italic 900 46px/1 Impact,"Arial Black",sans-serif;color:var(--ac)}
.rn span{color:var(--mu);font-size:13px}
.vc{display:flex;align-items:center;gap:12px;border:2px dashed var(--ac);border-radius:12px;padding:12px;margin:8px 0;background:var(--sf)}
.fl{display:inline-flex;align-items:center;gap:2px;font-weight:800;margin-right:6px;filter:drop-shadow(0 0 6px #ff7a00)}
.fl b{color:#ffb347}
.fl.dim,.flb.dim{filter:grayscale(.85) brightness(.9);opacity:.75}
.fl.off,.flb.off{filter:grayscale(1);opacity:.35}
.gem{display:inline-block;width:1em;height:1em;vertical-align:-.12em;background:linear-gradient(135deg,#8fdcff,#1e6bff 60%,#0b3aa8);clip-path:polygon(25% 5%,75% 5%,100% 38%,50% 100%,0 38%)}
.gv{font-size:34px;font-weight:900;color:#5fb4ff;text-shadow:0 0 12px #1e6bff}
.vc2{display:flex;gap:8px;align-items:center;margin-top:8px}

#p4{font-family:"Lilita One","Trebuchet MS",sans-serif;letter-spacing:.3px}
#p4 h3{margin:10px 0 8px;font-size:26px;color:#ffd75e;text-shadow:0 3px 0 #5a3500,0 0 0 #000;-webkit-text-stroke:1px #4a2a00;text-align:center}
#p4 .pr{background:linear-gradient(#6b4a2b,#4f351d);border:3px solid #2b1a0a;border-radius:12px;box-shadow:inset 0 2px 0 #9a7447,0 4px 0 #1d1105;color:#fff3d6}

#p4 .gv{font-family:inherit;font-size:40px;font-weight:400;color:#bfe6ff;text-shadow:0 3px 0 #0b3aa8,0 0 14px #3aa0ff}
#p4 .btn{font-family:inherit;font-weight:400;font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);background:linear-gradient(#7fe03a,#3fa51a);border:3px solid #1d4d08;border-radius:10px;box-shadow:inset 0 2px 0 #c3f58f,0 3px 0 #1d4d08;padding:8px 14px}

.pkg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.pkc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 4px 8px;border-radius:10px;border:3px solid #1d3f7a;background:radial-gradient(circle at 50% 30%,#5bb0ff,#2a6fd6 70%,#1b4a9a);box-shadow:inset 0 2px 0 #9fd3ff,0 3px 0 #10244a}

.pkc .rb{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#e8392b;color:#fff;font-size:11px;padding:1px 8px;border:2px solid #7a1208;border-radius:6px;white-space:nowrap}
.pkc .btn{width:100%;font-size:14px;padding:6px 2px}
.cl.nm{opacity:.12}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sg div{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px;text-align:center}
.sg span{display:block;font-size:20px;font-weight:900}
.sg small{color:var(--mu,#999);font-size:11px}

.pp{padding-bottom:140px}
.gw{overflow:visible}
.g{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:auto}
.g .cl{height:104px;padding:6px}
.g .cl i{font-size:13px}
.g .cl b{font-size:12px;padding:4px 6px;margin:0 -6px -6px}
.g .cl.fe{display:none}
.g.sm{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.g.sm .cl{height:auto}
#svb{left:12px!important;transform:none!important}
#rem{padding-right:84px!important}

#p4 .pr.bal{background:radial-gradient(circle at 50% 0,#2f6fe0,#14306f 70%);border-color:#0a1a42;box-shadow:inset 0 2px 0 #7fb2ff,0 4px 0 #060f2a}

.pr.sk{text-align:center;background:radial-gradient(circle at 50% 0,rgba(255,122,0,.22),transparent 60%),var(--sf);border-color:#6a3a08}
.pr.sk.ok{border-color:#ff7a00;box-shadow:0 0 18px rgba(255,122,0,.35)}
.sk1{display:flex;align-items:center;justify-content:center;gap:14px}
.sk1 .flb{font-size:64px}
.skn{font-size:56px;font-weight:900;line-height:1;color:#ffb347;text-shadow:0 0 16px rgba(255,122,0,.6)}

.mo{width:104px;height:96px;flex:none;filter:drop-shadow(0 4px 10px rgba(120,80,255,.55));overflow:visible}
@keyframes gulp{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg) translate(-2px,-2px)}}
@keyframes drip{0%{opacity:0;transform:translateY(-3px)}30%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.mo .can{transform-box:fill-box;transform-origin:50% 100%;animation:gulp 2.4s ease-in-out infinite}
.mo .dr circle{animation:drip 2.4s infinite}.mo .dr circle+circle{animation-delay:.9s}
@media (prefers-reduced-motion:reduce){.mo *{animation:none!important}}
.qr{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.qr.d{opacity:.55}

.qr .btn{margin:0;padding:10px 14px;font-size:18px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}

@keyframes twk{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
#p4 h3.shh{display:flex;justify-content:center;margin:14px 0 14px;-webkit-text-stroke:0;text-shadow:none}

#p4 .pr.bal{position:relative;overflow:hidden}
#p4 .pr.bal:before{content:"";position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;background:repeating-conic-gradient(rgba(150,200,255,.18) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;pointer-events:none}
